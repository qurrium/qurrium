---
name: Wheel Builds Nightly
on:
  push:
    tags:
      - 0.[0-9]+.[0-9]+.dev[0-9]+

jobs:
  build_wheels:
    if: github.repository == 'qurrium/qurry'
    name: Build wheels on ${{ matrix.system-arch }} by ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - system-arch: linux-x86_64
            os: [ubuntu-latest, self-hosted]
            archs: X64

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    outputs:
      call-publish: ${{ steps.build_wheels.outputs.call-publish }}

    environment:
      name: testpypi
      url: https://test.pypi.org/p/qurry

    steps:
      - uses: ./.github/actions/wheel-build
        id: build_wheels
        with:
          system-arch: ${{ matrix.system-arch }}
          os: ${{ matrix.os }}
          release: nightly

      - name: Clean up Docker Image of PyPI Publish
        if: runner.environment == 'self-hosted'
        run: |
          # Remove the Docker image of ghcr.io/pypa/gh-action-pypi-publish:release-v1
          # Prevent using outdated image
          docker rmi -f $(docker images -q ghcr.io/pypa/gh-action-pypi-publish:release-v1) || echo "No image found"

  publish-to-testpypi:
    if: github.repository == 'qurrium/qurry' && needs.build_wheels.outputs.call-publish == 'true'
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    runs-on: ubuntu-latest
    needs:
      - build_wheels
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    environment:
      name: testpypi
      url: https://test.pypi.org/p/qurry

    steps:
      - uses: ./.github/actions/wheel-publish
        id: publish_wheels
        with:
          release: nightly
